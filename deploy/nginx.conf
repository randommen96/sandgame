# =============================================================================
# Falling Sand — production Nginx configuration (static site)
# -----------------------------------------------------------------------------
# Deploy as a standalone main config (/etc/nginx/nginx.conf) or adapt the
# http/server blocks into your existing setup. The web root must contain ONLY
# public assets: index.html, src/, assets/. See deploy/README.md.
#
# Threat coverage (see SECURITY_PROGRESS.md):
#   Track 1 — version masking + strict security headers
#   Track 2 — rate limiting, payload/header limits, GET/HEAD-only methods
#   Track 3 — dotfile blocking, autoindex off, default-deny allowlist
# =============================================================================

user  www-data;
worker_processes  auto;
pid   /run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  1024;
}

http {
    # Explicit MIME table + opaque default type: unknown extensions are never
    # served as executable content (MIME-confusion defense, complemented by
    # X-Content-Type-Options: nosniff on the client side).
    include         /etc/nginx/mime.types;
    default_type    application/octet-stream;

    # --- Track 1: server token masking ---------------------------------------
    # Never disclose the nginx version in Server headers or error pages.
    server_tokens   off;

    sendfile        on;
    tcp_nopush      on;

    # --- Track 1: strict security headers ------------------------------------
    # Emitted on every response (incl. 404/405) thanks to `always`.
    #
    # CSP: this app is fully self-contained — no CDNs, no inline scripts,
    # no eval. script/style sources are restricted to 'self'; the favicon is
    # a data: URI (img-src data:); object/embed and navigation to other
    # origins are denied.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    # Clickjacking defense.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # MIME-sniffing prevention (pairs with the explicit mime.types above).
    add_header X-Content-Type-Options "nosniff" always;
    # Don't leak full URLs to third-party origins.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: enforced once the site is served over TLS (see deploy/README.md).
    # 1 year, including subdomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server {
        listen      80;
        # Replace with the production hostname(s) before going live.
        server_name _;

        root   /var/www/sandgame;
        index  index.html;

        location = / {
            try_files /index.html =404;
        }

        location ^~ /src/ {
            # Code is revalidated on every load during development; tighten to
            # a long max-age + content-hashed filenames for production.
            expires off;
            try_files $uri =404;
        }

        location ^~ /assets/ {
            # Static imagery (screenshots): cacheable for one day.
            expires 1d;
            try_files $uri =404;
        }
    }
}
